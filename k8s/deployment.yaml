apiVersion: apps/v1
kind: Deployment
metadata:
  name: techsolutions-deployment
  namespace: default
  labels:
    app: techsolutions
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: techsolutions
  template:
    metadata:
      labels:
        app: techsolutions
    spec:
      containers:
      - name: techsolutions
        image: syedumer98488/techsolutions-app:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
  